<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ profile.name }} · {{ profile.title }}{% endblock %}</title>
  <meta name="description" content="{{ profile.description }}">
  <meta name="author" content="{{ profile.name }}">
  <link rel="canonical" href="{{ profile.site_url }}/">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ profile.name }} · {{ profile.title }}">
  <meta property="og:description" content="{{ profile.description }}">
  <meta property="og:url" content="{{ profile.site_url }}/">
  <meta property="og:image" content="{{ profile.site_url }}/img/og-card.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0b0f14">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ asset('css/site.css') }}">
  <script>
    /* Pick the theme before first paint so there is no flash. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% block body %}{% endblock %}
  <script src="{{ asset('js/site.js') }}" defer></script>
</body>
</html>
