# Newest first. Each company has one or more roles; `highlights` are the bullets.
- company: Omnissa
  location: Sandy Springs, GA
  note: VMware's end-user computing division, spun off as an independent company.
  roles:
    - title: Staff Engineer, UEM Cloud Services / SaaS
      start: Jul 2024
      end: Present
      tags: [AWS, Terraform, Ansible, GitHub Actions, RDS, ElastiCache]
      highlights:
        - >-
          Led the two migrations the separation from VMware/Broadcom required:
          VMware Cloud on AWS to AWS native, and Bitbucket/Bamboo to GitHub and GitHub Actions.
        - >-
          Leading the UEM infrastructure transition: extending our automation to run
          on AWS native, vCenter and future platforms, including migrating customer
          environments and data between them.
        - >-
          Moved VM-based workloads to managed services (SQL Server to Amazon RDS,
          Memcached to ElastiCache) and set the pattern for AWS: Day 0/1 in Terraform,
          Day 2+ per-customer operations in Ansible.
        - >-
          Consolidated more than 125 repositories into a single monorepo, and wrote a
          custom GitHub Action for change detection so pull requests run only the
          tests they need. That cut build times and compute cost for our expensive
          Windows test suites.

