about:
  - >-
    I'm a Staff Engineer on the UEM Cloud Services / SaaS team at Omnissa, the
    company spun out of VMware's end-user computing division. I lead the
    infrastructure and automation projects behind Workspace ONE UEM SaaS: moving
    the platform from VMware Cloud on AWS to AWS native services, and moving our
    source control and CI from Bitbucket and Bamboo to GitHub Actions.
  - >-
    I got here the long way. I started out wiring office networks and building
    Exchange servers, spent seven years running IT for over a hundred small and
    mid-sized businesses, and then joined VMware, where I went from lab
    infrastructure to SRE to Staff Engineer. Along the way I picked up a strong
    bias for automation, testing, and code that other people can reuse.
  - >-
    Outside of work I run a homelab rack that is closer to a small production
    environment than a hobby, and I write open-source, self-hostable apps that
    run on it.

